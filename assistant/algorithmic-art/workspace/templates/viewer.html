<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- VARIABLE: Art Title --> — Algorithmic Art</title>
  <style>
    /* ============================================================
       FIXED SECTION — Do not modify this CSS
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    .sidebar {
      width: 320px;
      min-width: 320px;
      background: linear-gradient(180deg, #16213e 0%, #1a1a2e 100%);
      border-right: 1px solid rgba(255,255,255,0.08);
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sidebar h1 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .sidebar .subtitle { font-size: 12px; color: #888; font-style: italic; margin-bottom: 8px; }

    .section {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 16px;
    }

    .section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1.2px; color: #888; margin-bottom: 12px;
    }

    .seed-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .seed-display {
      font-family: 'Courier New', monospace; font-size: 18px;
      font-weight: 700; color: #d97757; flex: 1; text-align: center;
    }

    .seed-btn {
      width: 36px; height: 36px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: #ccc; border-radius: 8px; cursor: pointer;
      font-size: 16px; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .seed-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); color: #fff; }

    .seed-input-row { display: flex; gap: 8px; margin-top: 8px; width: 100%; }
    .seed-input {
      flex: 1; height: 32px; background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
      color: #fff; padding: 0 10px;
      font-family: 'Courier New', monospace; font-size: 13px;
    }
    .seed-input:focus { outline: none; border-color: #d97757; }

    .seed-jump-btn {
      height: 32px; padding: 0 12px; background: #d97757; color: #fff;
      border: none; border-radius: 6px; cursor: pointer;
      font-size: 12px; font-weight: 600; transition: background 0.15s ease;
    }
    .seed-jump-btn:hover { background: #c56847; }

    .param-group { margin-bottom: 12px; }
    .param-group:last-child { margin-bottom: 0; }
    .param-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .param-name { font-size: 13px; color: #ccc; }
    .param-value { font-size: 12px; font-family: 'Courier New', monospace; color: #d97757; min-width: 40px; text-align: right; }

    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 4px;
      background: rgba(255,255,255,0.1); border-radius: 2px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      background: #d97757; border-radius: 50%; cursor: pointer;
      transition: transform 0.1s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .color-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .color-group:last-child { margin-bottom: 0; }
    .color-label { font-size: 13px; color: #ccc; flex: 1; }

    input[type="color"] {
      -webkit-appearance: none; width: 36px; height: 28px;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
      cursor: pointer; background: transparent; padding: 2px;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }

    .action-btn {
      width: 100%; padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: #ccc; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 500;
      transition: all 0.15s ease; margin-bottom: 8px;
    }
    .action-btn:last-child { margin-bottom: 0; }
    .action-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: #fff; }
    .action-btn.primary { background: #d97757; border-color: #d97757; color: #fff; }
    .action-btn.primary:hover { background: #c56847; }

    .canvas-container {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #0f0f1a; position: relative; overflow: hidden;
    }
    .canvas-container canvas { display: block; max-width: 100%; max-height: 100%; }

    .art-description {
      font-size: 12px; color: #666; line-height: 1.5;
      padding: 12px; background: rgba(0,0,0,0.2);
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.04);
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar {
        width: 100%; min-width: unset; max-height: 40vh;
        border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08);
      }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <!-- Title — VARIABLE -->
    <div>
      <h1 id="art-title"><!-- VARIABLE: Art Title --></h1>
      <div class="subtitle" id="art-movement"><!-- VARIABLE: Movement Name --></div>
    </div>

    <!-- Seed Controls — FIXED -->
    <div class="section">
      <div class="section-title">Seed</div>
      <div class="seed-controls">
        <button class="seed-btn" onclick="prevSeed()" title="Previous">&#9664;</button>
        <span class="seed-display" id="seed-display">0</span>
        <button class="seed-btn" onclick="nextSeed()" title="Next">&#9654;</button>
        <button class="seed-btn" onclick="randomSeed_()" title="Random">&#9858;</button>
      </div>
      <div class="seed-input-row">
        <input type="text" class="seed-input" id="seed-input" placeholder="Enter seed...">
        <button class="seed-jump-btn" onclick="jumpToSeed()">Go</button>
      </div>
    </div>

    <!-- Parameters — VARIABLE: fill in per-artwork -->
    <div class="section">
      <div class="section-title">Parameters</div>
      <!-- Example:
      <div class="param-group">
        <div class="param-label">
          <span class="param-name">Particles</span>
          <span class="param-value" id="val-particleCount">500</span>
        </div>
        <input type="range" id="param-particleCount" min="50" max="2000" step="10" value="500"
               oninput="updateParam('particleCount', this.value)">
      </div>
      -->
    </div>

    <!-- Colors — VARIABLE: fill in per-artwork -->
    <div class="section">
      <div class="section-title">Palette</div>
      <!-- Example:
      <div class="color-group">
        <span class="color-label">Primary</span>
        <input type="color" id="color-primary" value="#d97757"
               oninput="updateColor('primary', this.value)">
      </div>
      -->
    </div>

    <!-- Actions — FIXED -->
    <div class="section">
      <div class="section-title">Actions</div>
      <button class="action-btn primary" onclick="regenerate()">Regenerate</button>
      <button class="action-btn" onclick="resetDefaults()">Reset Defaults</button>
      <button class="action-btn" onclick="downloadArt()">Download PNG</button>
      <button class="action-btn" onclick="downloadSVG()">Download SVG</button>
    </div>

    <!-- Description — VARIABLE -->
    <div class="art-description" id="art-description">
      <!-- VARIABLE: 2-3 sentence description of the algorithm and its artistic intent -->
    </div>
  </div>

  <div class="canvas-container" id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script>
    // ============================================================
    // FIXED SECTION — Seeded PRNG (do not modify)
    // ============================================================
    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    let rng;

    function initSeed(seed) {
      CONFIG.seed = seed;
      rng = mulberry32(seed);
      noiseSeed(seed);
      randomSeed(seed);
      document.getElementById('seed-display').textContent = seed;
      document.getElementById('seed-input').value = '';
    }

    function seededRandom(min = 0, max = 1) {
      return rng() * (max - min) + min;
    }

    function seededRandomInt(min, max) {
      return Math.floor(seededRandom(min, max + 1));
    }

    function seededGaussian(mean = 0, sd = 1) {
      let u1 = rng(), u2 = rng();
      while (u1 === 0) u1 = rng();
      return mean + sd * Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
    }

    // ============================================================
    // FIXED SECTION — Seed Navigation (do not modify)
    // ============================================================
    function prevSeed() { initSeed(CONFIG.seed - 1); regenerate(); }
    function nextSeed() { initSeed(CONFIG.seed + 1); regenerate(); }
    function randomSeed_() { initSeed(Math.floor(Math.random() * 999999)); regenerate(); }
    function jumpToSeed() {
      const input = document.getElementById('seed-input').value.trim();
      const seed = parseInt(input, 10);
      if (!isNaN(seed)) { initSeed(seed); regenerate(); }
    }

    // ============================================================
    // FIXED SECTION — Parameter & Color Update System
    // ============================================================
    const INITIAL_PARAMS = {};
    const INITIAL_COLORS = {};

    function updateParam(key, value) {
      CONFIG.params[key].value = parseFloat(value);
      const display = document.getElementById(`val-${key}`);
      if (display) display.textContent = CONFIG.params[key].value;
      regenerate();
    }

    function updateColor(key, value) {
      CONFIG.colors[key] = value;
      regenerate();
    }

    function resetDefaults() {
      Object.keys(INITIAL_PARAMS).forEach(key => {
        CONFIG.params[key].value = INITIAL_PARAMS[key];
        const slider = document.getElementById(`param-${key}`);
        const display = document.getElementById(`val-${key}`);
        if (slider) slider.value = INITIAL_PARAMS[key];
        if (display) display.textContent = INITIAL_PARAMS[key];
      });
      Object.keys(INITIAL_COLORS).forEach(key => {
        CONFIG.colors[key] = INITIAL_COLORS[key];
        const picker = document.getElementById(`color-${key}`);
        if (picker) picker.value = INITIAL_COLORS[key];
      });
      regenerate();
    }

    // ============================================================
    // FIXED SECTION — Download Functions
    // ============================================================
    function downloadArt() {
      saveCanvas(`algorithmic-art-seed-${CONFIG.seed}`, 'png');
    }

    function downloadSVG() {
      saveCanvas(`algorithmic-art-seed-${CONFIG.seed}`, 'png');
    }

    // ============================================================
    // FIXED SECTION — Utility Functions
    // ============================================================
    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return { r, g, b };
    }

    function lerpColor_(c1, c2, t) {
      const a = hexToRgb(c1), b = hexToRgb(c2);
      const r = Math.round(a.r + (b.r - a.r) * t);
      const g = Math.round(a.g + (b.g - a.g) * t);
      const bl = Math.round(a.b + (b.b - a.b) * t);
      return `rgb(${r},${g},${bl})`;
    }

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function polarToCart(cx, cy, r, angle) {
      return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
    }

    const PHI = (1 + Math.sqrt(5)) / 2;
    const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

    // ============================================================
    // VARIABLE SECTION — CONFIG (fill this in)
    // ============================================================
    const CONFIG = {
      canvasWidth: 1200,
      canvasHeight: 1200,
      seed: 0,
      params: {
        // Define your parameters here. Example:
        // particleCount: { value: 500, min: 50, max: 2000, step: 10, label: 'Particles' },
      },
      colors: {
        // Define your colors here. Example:
        // primary: '#d97757',
        // secondary: '#6a9bcc',
        // accent: '#788c5d',
        // background: '#0f0f1a',
      },
    };

    // ============================================================
    // VARIABLE SECTION — Core Algorithm (fill this in)
    // ============================================================

    // Let your philosophy guide the implementation.
    // The world is your oyster — be creative!

    function generateArt() {
      initSeed(CONFIG.seed);
      // ... your algorithm here ...
    }

    // ============================================================
    // FIXED SECTION — p5.js Lifecycle
    // ============================================================
    function setup() {
      const container = document.getElementById('canvas-container');
      const canvas = createCanvas(CONFIG.canvasWidth, CONFIG.canvasHeight);
      canvas.parent(container);

      // Store initial values for reset
      Object.keys(CONFIG.params).forEach(key => {
        INITIAL_PARAMS[key] = CONFIG.params[key].value;
      });
      Object.keys(CONFIG.colors).forEach(key => {
        INITIAL_COLORS[key] = CONFIG.colors[key];
      });

      initSeed(0);
      noLoop();
      generateArt();
    }

    function regenerate() {
      generateArt();
    }
  </script>
</body>
</html>
