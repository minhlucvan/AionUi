<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- VARIABLE: artwork title --></title>
<script src="../three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a14;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ──── Sidebar ──── */
  .sidebar {
    width: 320px;
    min-width: 320px;
    background: linear-gradient(180deg, #16213e 0%, #1a1a2e 100%);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  .sidebar-header {
    padding: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .sidebar-header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 6px;
  }
  .sidebar-header p {
    font-size: 12px;
    color: #8899aa;
    line-height: 1.5;
  }

  .section {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #667788;
    margin-bottom: 12px;
    font-weight: 600;
  }

  /* ──── Seed Controls ──── */
  .seed-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .seed-input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: #fff;
    padding: 8px 12px;
    font-size: 14px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }
  .seed-input:focus { border-color: #d97757; }

  .btn-seed {
    width: 34px;
    height: 34px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #ccc;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
  }
  .btn-seed:hover { background: rgba(217,119,87,0.2); border-color: #d97757; color: #d97757; }

  /* ──── Sliders ──── */
  .param-group { margin-bottom: 12px; }
  .param-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 4px;
  }
  .param-label span:first-child { color: #aabbcc; }
  .param-label span:last-child { color: #d97757; font-family: monospace; }

  input[type="range"] {
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #d97757;
    cursor: pointer;
    border: 2px solid #1a1a2e;
  }

  /* ──── Color Pickers ──── */
  .color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .color-row label { font-size: 12px; color: #aabbcc; min-width: 70px; }
  .color-row input[type="color"] {
    width: 32px;
    height: 24px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    background: none;
    cursor: pointer;
    padding: 0;
  }
  .color-hex {
    font-size: 11px;
    color: #667788;
    font-family: monospace;
  }

  /* ──── Action Buttons ──── */
  .actions { display: flex; flex-direction: column; gap: 8px; }
  .btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
    text-align: center;
  }
  .btn-primary {
    background: #d97757;
    color: #fff;
  }
  .btn-primary:hover { background: #c4663f; }
  .btn-secondary {
    background: rgba(255,255,255,0.06);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); }

  /* ──── Canvas Area ──── */
  .canvas-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a14;
    overflow: hidden;
  }
  .canvas-area canvas { display: block; }

  /* ──── Description ──── */
  .description {
    padding: 16px 20px;
    font-size: 12px;
    color: #667788;
    line-height: 1.6;
  }
  .description a { color: #d97757; text-decoration: none; }
</style>
</head>
<body>

<div class="sidebar">
  <!-- ─── Header ─── -->
  <div class="sidebar-header">
    <h1><!-- VARIABLE: artwork title --></h1>
    <p><!-- VARIABLE: short description of the artwork and its 3D concept --></p>
  </div>

  <!-- ─── Seed Controls (FIXED — do not modify) ─── -->
  <div class="section">
    <div class="section-title">Seed</div>
    <div class="seed-row">
      <button class="btn-seed" onclick="changeSeed(-1)" title="Previous">&#9664;</button>
      <input type="number" class="seed-input" id="seedInput" value="42" min="0" max="9999" onchange="setSeed(this.value)">
      <button class="btn-seed" onclick="changeSeed(1)" title="Next">&#9654;</button>
      <button class="btn-seed" onclick="randomSeed()" title="Random">&#9776;</button>
    </div>
  </div>

  <!-- ─── Parameters (VARIABLE — customize per artwork) ─── -->
  <div class="section">
    <div class="section-title">Parameters</div>

    <!-- VARIABLE: Add parameter sliders here. Example: -->
    <div class="param-group">
      <div class="param-label"><span>Parameter 1</span><span id="param1Val">50</span></div>
      <input type="range" id="param1" min="1" max="100" value="50"
             oninput="CONFIG.param1=+this.value; document.getElementById('param1Val').textContent=this.value; regenerate()">
    </div>
    <!-- Add more param-group divs as needed -->
  </div>

  <!-- ─── Colors (VARIABLE — customize per artwork) ─── -->
  <div class="section">
    <div class="section-title">Colors</div>

    <!-- VARIABLE: Add color pickers here. Example: -->
    <div class="color-row">
      <label>Primary</label>
      <input type="color" id="color1" value="#d97757" onchange="CONFIG.colors[0]=this.value; regenerate()">
      <span class="color-hex" id="color1Hex">#d97757</span>
    </div>
    <div class="color-row">
      <label>Secondary</label>
      <input type="color" id="color2" value="#6a9bcc" onchange="CONFIG.colors[1]=this.value; regenerate()">
      <span class="color-hex" id="color2Hex">#6a9bcc</span>
    </div>
    <div class="color-row">
      <label>Accent</label>
      <input type="color" id="color3" value="#88d4ab" onchange="CONFIG.colors[2]=this.value; regenerate()">
      <span class="color-hex" id="color3Hex">#88d4ab</span>
    </div>
    <!-- Add more color-row divs as needed -->
  </div>

  <!-- ─── Actions (FIXED — do not modify) ─── -->
  <div class="section">
    <div class="section-title">Actions</div>
    <div class="actions">
      <button class="btn btn-primary" onclick="regenerate()">&#8634; Regenerate</button>
      <button class="btn btn-secondary" onclick="resetDefaults()">Reset Defaults</button>
      <button class="btn btn-secondary" onclick="downloadPNG()">&#11015; Download PNG</button>
    </div>
  </div>

  <!-- ─── Description (VARIABLE) ─── -->
  <div class="description">
    <!-- VARIABLE: Detailed description of the 3D algorithm, its mathematical basis, and artistic intent -->
    <p>Describe the 3D algorithmic techniques used, the spatial concepts involved, and the artistic philosophy behind the piece.</p>
  </div>
</div>

<div class="canvas-area" id="canvasContainer"></div>

<script>
// ============================================================
// FIXED SECTION — Mulberry32 PRNG & Seed Management
// Do NOT modify this section
// ============================================================
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

let currentSeed = 42;
let rng = mulberry32(currentSeed);

function seededRandom() { return rng(); }
function seededRandomRange(min, max) { return min + seededRandom() * (max - min); }
function seededRandomInt(min, max) { return Math.floor(seededRandomRange(min, max + 1)); }
function seededGaussian(mean, sd) {
  let u1 = seededRandom(), u2 = seededRandom();
  return mean + sd * Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}
function seededShuffle(arr) {
  let a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(seededRandom() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setSeed(val) {
  currentSeed = parseInt(val) || 0;
  document.getElementById('seedInput').value = currentSeed;
  regenerate();
}
function changeSeed(delta) { setSeed(currentSeed + delta); }
function randomSeed() { setSeed(Math.floor(Math.random() * 10000)); }

function regenerate() {
  rng = mulberry32(currentSeed);
  if (typeof generateArt === 'function') {
    clearScene();
    generateArt();
    if (renderer && scene && camera) {
      renderer.render(scene, camera);
    }
  }
}

function resetDefaults() {
  Object.assign(CONFIG, JSON.parse(JSON.stringify(DEFAULT_CONFIG)));
  syncUIFromConfig();
  regenerate();
}

function downloadPNG() {
  if (renderer && scene && camera) {
    renderer.render(scene, camera);
    let link = document.createElement('a');
    link.download = 'artwork_seed_' + currentSeed + '.png';
    link.href = renderer.domElement.toDataURL('image/png');
    link.click();
  }
}

// ============================================================
// FIXED SECTION — Three.js Scene Cleanup
// Do NOT modify this section
// ============================================================
function clearScene() {
  if (!scene) return;
  while (scene.children.length > 0) {
    let obj = scene.children[0];
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
    scene.remove(obj);
  }
}

// ============================================================
// FIXED SECTION — OrbitControls (inline)
// Minimal OrbitControls implementation
// ============================================================
class OrbitControls {
  constructor(camera, domElement) {
    this.camera = camera;
    this.domElement = domElement;
    this.enableDamping = true;
    this.dampingFactor = 0.05;
    this.rotateSpeed = 0.8;
    this.zoomSpeed = 1.0;
    this.target = new THREE.Vector3();

    this._spherical = new THREE.Spherical();
    this._sphericalDelta = new THREE.Spherical();
    this._scale = 1;
    this._isDragging = false;
    this._previousMouse = { x: 0, y: 0 };

    this._updateSpherical();
    this._bindEvents();
  }

  _updateSpherical() {
    let offset = new THREE.Vector3().subVectors(this.camera.position, this.target);
    this._spherical.setFromVector3(offset);
  }

  _bindEvents() {
    this.domElement.addEventListener('mousedown', (e) => {
      this._isDragging = true;
      this._previousMouse = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mouseup', () => { this._isDragging = false; });
    window.addEventListener('mousemove', (e) => {
      if (!this._isDragging) return;
      let dx = e.clientX - this._previousMouse.x;
      let dy = e.clientY - this._previousMouse.y;
      this._previousMouse = { x: e.clientX, y: e.clientY };
      this._sphericalDelta.theta -= dx * 0.005 * this.rotateSpeed;
      this._sphericalDelta.phi -= dy * 0.005 * this.rotateSpeed;
    });
    this.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY > 0) this._scale *= 1.05;
      else this._scale /= 1.05;
    }, { passive: false });
  }

  update() {
    this._spherical.theta += this._sphericalDelta.theta;
    this._spherical.phi += this._sphericalDelta.phi;
    this._spherical.phi = Math.max(0.01, Math.min(Math.PI - 0.01, this._spherical.phi));
    this._spherical.radius *= this._scale;
    this._spherical.radius = Math.max(0.5, Math.min(100, this._spherical.radius));

    if (this.enableDamping) {
      this._sphericalDelta.theta *= (1 - this.dampingFactor);
      this._sphericalDelta.phi *= (1 - this.dampingFactor);
      this._scale += (1 - this._scale) * this.dampingFactor;
    } else {
      this._sphericalDelta.set(0, 0, 0);
      this._scale = 1;
    }

    let offset = new THREE.Vector3().setFromSpherical(this._spherical);
    this.camera.position.copy(this.target).add(offset);
    this.camera.lookAt(this.target);
  }
}

// ============================================================
// VARIABLE SECTION — CONFIG & DEFAULT_CONFIG
// Customize these for each artwork
// ============================================================
const DEFAULT_CONFIG = {
  // VARIABLE: Define default parameters
  param1: 50,
  colors: ['#d97757', '#6a9bcc', '#88d4ab'],
  background: '#0a0a14'
};

const CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));

// Sync UI controls from CONFIG values
function syncUIFromConfig() {
  // VARIABLE: Update all UI controls to reflect CONFIG
  document.getElementById('param1').value = CONFIG.param1;
  document.getElementById('param1Val').textContent = CONFIG.param1;

  CONFIG.colors.forEach((c, i) => {
    let picker = document.getElementById('color' + (i + 1));
    let hex = document.getElementById('color' + (i + 1) + 'Hex');
    if (picker) { picker.value = c; }
    if (hex) { hex.textContent = c; }
  });
}

// ============================================================
// VARIABLE SECTION — Three.js Scene Setup & Art Generation
// Replace with your 3D algorithm
// ============================================================
const CANVAS_SIZE = 1200;
let scene, camera, renderer, controls;

function initThree() {
  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(CONFIG.background);

  // Camera
  camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
  camera.position.set(0, 2, 5);

  // Renderer — preserveDrawingBuffer is required for PNG export
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(CANVAS_SIZE, CANVAS_SIZE);
  renderer.setPixelRatio(1);
  document.getElementById('canvasContainer').appendChild(renderer.domElement);

  // Camera controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Generate initial art
  generateArt();

  // Render loop
  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function generateArt() {
  // VARIABLE: Replace this entire function with your 3D algorithm
  // Use seededRandom() instead of Math.random()
  // Use CONFIG for all parameters
  // Use CONFIG.colors for palette
  // Use CONFIG.background for scene background

  scene.background = new THREE.Color(CONFIG.background);

  // Add lights
  scene.add(new THREE.AmbientLight(0x404040, 0.6));
  let dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  // Example: scatter some spheres to show the template works
  for (let i = 0; i < 50; i++) {
    let geo = new THREE.SphereGeometry(seededRandomRange(0.1, 0.4), 16, 12);
    let colorHex = CONFIG.colors[seededRandomInt(0, CONFIG.colors.length - 1)];
    let mat = new THREE.MeshStandardMaterial({
      color: colorHex,
      roughness: 0.6,
      metalness: 0.3
    });
    let mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      seededRandomRange(-3, 3),
      seededRandomRange(-2, 2),
      seededRandomRange(-3, 3)
    );
    scene.add(mesh);
  }
}

// Initialize on page load
window.addEventListener('DOMContentLoaded', initThree);

// Handle color picker hex display updates
document.querySelectorAll('input[type="color"]').forEach(picker => {
  picker.addEventListener('input', function() {
    let hexSpan = document.getElementById(this.id + 'Hex');
    if (hexSpan) hexSpan.textContent = this.value;
  });
});
</script>
</body>
</html>
